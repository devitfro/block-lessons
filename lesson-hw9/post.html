<!DOCTYPE html>
<html>
<head>
  <title>DApp Posts</title>

  <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>

  <style>
    body { font-family: Arial; }

    .card {
      border: 1px solid #ccc;
      padding: 15px;
      margin: 10px;
      width: 300px;
    }

    img { width: 100%; }
  </style>
</head>

<body>

<h2>Create Post</h2>

<input id="title" placeholder="Title"><br>
<input id="content" placeholder="Content"><br>
<input id="img" placeholder="Image URL"><br>
<button onclick="createPost()">Create</button>

<hr>

<button onclick="loadPosts()">All Posts</button>
<button onclick="loadMyPosts()">My Posts</button>

<div id="posts"></div>

<script>

let web3;
let contract;
let account;

const contractAddress = "0x5FbDB2315678afecb367f032d93F642f64180aa3";

const abi = [
  {
    "inputs":[
      {"internalType":"string","name":"_title","type":"string"},
      {"internalType":"string","name":"_content","type":"string"},
      {"internalType":"string","name":"_imageUrl","type":"string"}
    ],
    "name":"createPost","outputs":[],"stateMutability":"nonpayable","type":"function"
  },
  {
    "inputs":[],"name":"getPosts",
    "outputs":[{"components":[
      {"internalType":"uint256","name":"id","type":"uint256"},
      {"internalType":"string","name":"title","type":"string"},
      {"internalType":"string","name":"content","type":"string"},
      {"internalType":"address","name":"author","type":"address"},
      {"internalType":"uint256","name":"createdAt","type":"uint256"},
      {"internalType":"string","name":"imageUrl","type":"string"},
      {"internalType":"uint256","name":"likes","type":"uint256"}
    ],"internalType":"struct PostStorage.Post[]","name":"","type":"tuple[]"}],
    "stateMutability":"view","type":"function"
  },
  {
    "inputs":[{"internalType":"uint256","name":"_id","type":"uint256"}],
    "name":"deletePost","outputs":[],"stateMutability":"nonpayable","type":"function"
  },
  {
    "inputs":[{"internalType":"uint256","name":"_id","type":"uint256"}],
    "name":"toggleLike","outputs":[],"stateMutability":"nonpayable","type":"function"
  }
];

async function init() {
  if (window.ethereum) {
    web3 = new Web3(window.ethereum);
    await window.ethereum.request({ method: "eth_requestAccounts" });

    const accounts = await web3.eth.getAccounts();
    account = accounts[0];

    contract = new web3.eth.Contract(abi, contractAddress);

    loadPosts();
  }
}

async function createPost() {
  const title = document.getElementById("title").value;
  const content = document.getElementById("content").value;
  const img = document.getElementById("img").value;

  await contract.methods.createPost(title, content, img)
    .send({ from: account });

  loadPosts();
}

async function loadPosts() {
  const posts = await contract.methods.getPosts().call();
  render(posts);
}

async function loadMyPosts() {
  const posts = await contract.methods.getPosts().call();

  const filtered = posts.filter(p =>
    p.author.toLowerCase() === account.toLowerCase()
  );

  render(filtered);
}

async function deletePost(id) {
  await contract.methods.deletePost(id).send({ from: account });
  loadPosts();
}

async function toggleLike(id) {
  await contract.methods.toggleLike(id).send({ from: account });
  loadPosts();
}

function render(posts) {
  const container = document.getElementById("posts");
  container.innerHTML = "";

  posts.forEach(p => {
    if (!p.author) return;

    let html = `
      <div class="card">
        <h3>${p.title}</h3>
        <p>${p.content}</p>
        <p>${p.author}</p>
        <p>${new Date(p.createdAt * 1000).toLocaleString()}</p>
        <img src="${p.imageUrl}">
        <button onclick="toggleLike(${p.id})">❤️ ${p.likes}</button>
    `;

    if (p.author.toLowerCase() === account.toLowerCase()) {
      html += `<button onclick="deletePost(${p.id})">Delete</button>`;
    }

    html += `</div>`;

    container.innerHTML += html;
  });
}

init();

</script>

</body>
</html>
