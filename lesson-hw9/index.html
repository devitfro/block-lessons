<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>Storage</h1>
  <p>Current value: <span id="value">?</span></p>

  <input type="number" placeholder="set value" id="number" style="padding: 10px 12px; width: 200px;"> 
  <button onclick="set_value()"></button>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.15.0/ethers.umd.min.js"></script>
  <script src="./scripts/contract_abi.js"></script>
  <script>
    const contract_address = "0xDc64a140Aa3E981100a9becA4E685f962f0cF6C9";

    const c_abi = [
      "function get_value() public view returns(uint)"
    ]

    const set_value = async () => {
      const provider = new ethers.BrowserProvider(window.ethereum);
      await provider.send("eth_requestAccounts", []);

      const signer = await provider.getSigner();

      const contract = new ethers.Contract(contract_address, abi, signer);

      const value = document.getElementById("number").value;

      const tx = await contract.set_value(value);
      await tx.wait();
      get_value();
    }

    const get_value = async () => {
      const provider = new ethers.BrowserProvider(window.ethereum);
      const contract = new ethers.Contract(contract_address, c_abi, provider);

      const value = await contract.get_value();
      document.getElementById("value").textContent = `${value}`;
    }
    get_value();
  </script>
</body>
</html>
